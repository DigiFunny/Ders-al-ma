<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mağaza — Pugi</title>
  <style>
    body { background: #080d18; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 16px; }
  </style>
</head>
<body>
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('pugi_active_theme');
        if (savedTheme) { document.body.className = 'theme-' + savedTheme; }
      } catch (e) { console.error(e); }
    })();
  </script>
  <h2>Mağaza</h2>
  <p>Pugi mağaza ve kozmetik sayfası.</p>
</body>
</html>
