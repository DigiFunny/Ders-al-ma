<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="config.js"></script>
  <title>Pugi — YKS Çalışma Takip</title>
  <style>
    :root {
      --bg: #080d18; --bg2: #0e1628; --bg3: #131e33;
      --card: #111827; --card2: #162035; --border: #1c2d47;
      --accent: #38bdf8; --accent2: #818cf8; --text: #e2e8f0;
      --muted: #4b6280; --warn: #f87171;
    }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 16px; margin: 0; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
    .input-wrapper { display: flex; flex-direction: column; gap: 4px; }
    .input-wrapper label { font-size: 0.85rem; color: var(--accent); font-weight: 600; }
    .form-control { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 1rem; width: 100%; box-sizing: border-box; }
    .error-text { color: var(--warn); font-size: 0.75rem; margin-top: 2px; font-weight: 600; min-height: 16px; }
    .btn-main { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 12px; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body class="theme-dark">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('pugi_active_theme');
        if (savedTheme) { document.body.className = 'theme-' + savedTheme; }
      } catch (e) { console.error(e); }
    })();
  </script>

  <div id="entryFormSection" class="card">
    <h3 style="margin-top:0; margin-bottom:16px; font-size:1.1rem; color:#fff;">Çalışma Verisi Gir</h3>
    <div class="form-grid">
      <div class="input-wrapper">
        <label for="inDogru">Doğru</label>
        <input type="number" id="inDogru" class="form-control" placeholder="0" min="0">
        <div id="soruDogruErr" class="error-text"></div>
      </div>
      <div class="input-wrapper">
        <label for="inYanlis">Yanlış</label>
        <input type="number" id="inYanlis" class="form-control" placeholder="0" min="0">
        <div id="soruYanlisErr" class="error-text"></div>
      </div>
      <div class="input-wrapper">
        <label for="inNet">Net</label>
        <input type="text" id="inNet" class="form-control" readonly placeholder="0.00">
      </div>
      <div class="input-wrapper">
        <label for="inSure">Süre (Dk)</label>
        <input type="number" id="inSure" class="form-control" placeholder="0" min="0">
        <div id="soruSureErr" class="error-text"></div>
      </div>
    </div>
    <button id="btnSaveEntry" class="btn-main" onclick="handleSaveEntry()">Çalışmayı Kaydet</button>
  </div>

  <script>
    const dInput = document.getElementById('inDogru');
    const yInput = document.getElementById('inYanlis');
    const nInput = document.getElementById('inNet');
    const sInput = document.getElementById('inSure');
    const dErr   = document.getElementById('soruDogruErr');
    const yErr   = document.getElementById('soruYanlisErr');
    const sErr   = document.getElementById('soruSureErr');

    function calculateNet() {
      let d = parseFloat(dInput.value) || 0;
      let y = parseFloat(yInput.value) || 0;
      if (d < 0) { if(dErr) dErr.textContent = "Negatif olamaz"; dInput.value = 0; d = 0; } else { if(dErr) dErr.textContent = ""; }
      if (y < 0) { if(yErr) yErr.textContent = "Negatif olamaz"; yInput.value = 0; y = 0; } else { if(yErr) yErr.textContent = ""; }
      let net = d - (y * 0.25);
      nInput.value = net < 0 ? "0.00" : net.toFixed(2);
    }

    if(dInput && yInput) {
      dInput.addEventListener('input', calculateNet);
      yInput.addEventListener('input', calculateNet);
    }

    function handleSaveEntry() {
      const s = parseInt(sInput.value) || 0;
      if (s <= 0) {
        if(sErr) sErr.textContent = "Süre girilmelidir.";
        return;
      } else {
        if(sErr) sErr.textContent = "";
      }
      alert("Başarıyla Kaydedildi!");
    }
  </script>
</body>
</html>
